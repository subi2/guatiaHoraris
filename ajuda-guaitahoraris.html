<!doctype html>
<html lang="ca"><head><meta charset="utf-8">

<title>GuaitaHoraris — Ajuda</title>
<style>
:root{--ink:#14181d;--muted:#5b6670;--line:#d8dee4;--accent:#0f766e;--accent-d:#0b5a54;--panel:#f6f8fa;--soft:#eef6f5}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);font-size:14.5px;line-height:1.55}
.wrap{display:grid;grid-template-columns:282px 1fr;height:100vh}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.brand{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;font-weight:650}
.brand .dot{width:9px;height:9px;background:var(--accent);transform:rotate(45deg);display:inline-block}
.brand small{display:block;color:var(--muted);font-weight:400;font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em}
.search{padding:10px 12px;border-bottom:1px solid var(--line)}
.search input{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:13px;font-family:inherit}
.search input:focus{outline:2px solid var(--soft);border-color:var(--accent)}
nav{overflow:auto;padding:8px 8px 20px;flex:1;min-height:0}
nav a{display:block;padding:7px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:13.5px;cursor:pointer}
nav a:hover{background:#eef1f4}
nav a.active{background:var(--accent);color:#fff}
nav a .hl{background:#ffe9a8;border-radius:3px}
nav .empty{color:var(--muted);font-size:12.5px;padding:8px 10px}
main{overflow:auto;min-height:0}
.content{max-width:760px;padding:26px 30px}
h1{font-size:21px;letter-spacing:-.01em;margin:0 0 4px}
.crumb{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 20px;font-weight:600}
h3{font-size:15px;margin:22px 0 6px;color:var(--accent-d)}
a{color:var(--accent)}
code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--soft);padding:1px 5px;border-radius:4px;font-size:.92em;color:var(--accent-d)}
pre{font-family:ui-monospace,Menlo,Consolas,monospace;background:#f6f8fa;border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:12.5px;overflow:auto;line-height:1.45}
ul,ol{padding-left:22px}li{margin:3px 0}
.callout{background:var(--soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:9px 13px;margin:14px 0;font-size:13.5px}
.nav-btns{display:flex;justify-content:space-between;margin-top:30px;gap:10px}
.nav-btns button{font-family:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;cursor:pointer;color:var(--ink)}
.nav-btns button:hover{border-color:var(--accent);color:var(--accent)}
.nav-btns button:disabled{opacity:.4;cursor:default}
.foot{margin-top:26px;padding-top:14px;border-top:1px solid #e9edf1;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:8px}
.foot .sig{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.14em;color:var(--ink);display:inline-flex;align-items:center;gap:7px}
.foot .sig::before{content:"";width:7px;height:7px;background:var(--accent);transform:rotate(45deg);display:inline-block}
@media(max-width:720px){.wrap{grid-template-columns:1fr;height:auto}aside{height:auto;position:sticky;top:0;z-index:5}nav{max-height:34vh}}
</style></head>

<script>
const TOPICS=[{"id": "inici", "title": "Què és GuaitaHoraris", "kw": ["GuaitaHoraris", "introducció", "visió general"], "body": "\n<p><strong>GuaitaHoraris</strong> és una eina autocontinguda per combinar horaris d'assignatures i\nprofessors d'universitat. Tot s'executa al navegador, <em>sense connexió</em> i sense cap dependència\nexterna, i es pot empaquetar com a aplicació d'escriptori amb Tauri o pake.</p>\n\n<p class=\"callout\">El motor de càlcul és optimització combinatòria clàssica\n(<em>recuit simulat</em>), <strong>no</strong> intel·ligència artificial generativa. Per això és\nràpid, reproduïble i no inventa solucions: o respecta les restriccions o t'avisa que no pot.</p>\n\n<h3>Què resol</h3>\n<p>Donades les assignatures (amb hores i bloc), els professors (amb disponibilitat i afinitats),\nels grups, les aules i una graella temporal, l'eina assigna a cada sessió una <strong>franja\nhorària</strong>, una <strong>aula</strong> i un <strong>professor</strong>, mirant de no violar cap\nrestricció dura i de satisfer al màxim les desiderates (preferències).</p>\n\n<h3>El flux de treball</h3>\n<p>El menú superior està dividit per una <strong>fletxa →</strong>. A l'esquerra hi ha el que\n<em>introdueixes tu</em> i es desa automàticament (Dades, Disponibilitats, Afinitats, Restriccions).\nA la dreta, el que <em>genera el programa</em> (Resoldre, Horari, Mètriques).</p>\n"}, {"id": "quickstart", "title": "Inici ràpid", "kw": ["inici ràpid", "primers passos", "exemple"], "body": "\n<p>En quatre passos tens un horari:</p>\n<ol>\n<li>En obrir l'eina ja hi ha un <strong>exemple</strong> carregat (assignatures Dibuix I/II i RAI–RAIV,\nsis professors, grups i aules). Pots tornar-lo a carregar amb el botó <em>Exemple</em>.</li>\n<li>Ves a la pestanya <strong>Resoldre</strong> i prem <strong>▶ Resol</strong>. Una barra de progrés\nmostra la cerca; en uns segons salta a la pestanya Horari.</li>\n<li>A <strong>Horari</strong> veus la graella resultant. Canvia la vista entre <em>Per grup</em>,\n<em>Per professor</em> i <em>Per aula</em>.</li>\n<li>A <strong>Mètriques</strong> comproves la qualitat, la càrrega de cada professor i si hi ha\nconflictes.</li>\n</ol>\n<p>A partir d'aquí, edita les teves dades reals i torna a resoldre tantes vegades com vulguis. Tot\nqueda desat entre sessions.</p>\n"}, {"id": "dades", "title": "Dades: assignatures, professors, aules i grups", "kw": ["dades", "assignatures", "professors", "aules", "grups", "graella temporal", "bloc", "tipus d'aula"], "body": "\n<p>La pestanya <strong>Dades</strong> conté les taules editables. Cada taula té un botó\n<em>+</em> per afegir files i una <em>×</em> per esborrar-les.</p>\n\n<h3>Assignatures</h3>\n<ul>\n<li><strong>Hores</strong>: hores setmanals que s'han de programar.</li>\n<li><strong>Bloc</strong>: durada mínima d'una sessió, en hores. Si una assignatura té 4 hores i bloc 2,\nes programen dues sessions de 2 hores. Els tallers volen blocs llargs (3–4 h).</li>\n<li><strong>Tipus aula</strong>: Aula, Taller, Informàtica o Laboratori. Ha de coincidir amb el tipus\nde l'aula assignada.</li>\n<li><strong>Color</strong>: color del bloc a la graella.</li>\n</ul>\n\n<h3>Professors</h3>\n<p>Nom i <strong>càrrega màxima</strong> en hores/setmana (informativa: es mostra a Mètriques per\ndetectar sobrecàrregues). La disponibilitat i les afinitats es configuren a les seves pestanyes.</p>\n\n<h3>Aules</h3>\n<p>Nom, <strong>capacitat</strong> i <strong>tipus</strong>. La capacitat ha de ser ≥ la mida del grup\ni el tipus ha de coincidir amb el de l'assignatura.</p>\n\n<h3>Grups</h3>\n<p>Nom, <strong>mida</strong> i les <strong>assignatures</strong> que cursa. Clica les assignatures per\nafegir-les o treure-les del grup.</p>\n\n<h3>Graella temporal</h3>\n<p>Defineix els <strong>dies</strong> (separats per comes), les <strong>hores/dia</strong> (nombre de\nfranges), l'<strong>hora d'inici</strong> i els <strong>minuts per franja</strong>. Tot l'horari es\ndiscretitza en aquestes franges.</p>\n"}, {"id": "import", "title": "Importar des de Markdown o porta-retalls", "kw": ["importar", "markdown", "porta-retalls", "plantilla", "prompt", "afegeix", "substitueix"], "body": "\n<p>Dalt de la pestanya <strong>Dades</strong> hi ha la targeta <em>Importa des de Markdown o\nporta-retalls</em>. Permet carregar de cop professors, assignatures i grups.</p>\n\n<h3>Com s'utilitza</h3>\n<ul>\n<li><strong>Enganxa</strong> el text al camp, o prem <em>Carrega .md…</em> per a un fitxer.</li>\n<li><strong>Afegeix / actualitza</strong>: combina amb el que ja tens. Si un nom ja existeix,\nn'actualitza les dades; si no, el crea. No duplica.</li>\n<li><strong>Substitueix</strong>: demana confirmació i elimina els registres del tipus importat que no\napareguin al text (i en neteja les referències).</li>\n</ul>\n\n<h3>Format esperat</h3>\n<p>Una taula Markdown per entitat. Qualsevol de les tres és opcional. El parser llegeix per nom de\ncolumna (tolera accents, majúscules, ordre i prosa entremig).</p>\n<pre>## Assignatures\n| Nom | Hores | Bloc | Tipus |\n|-----|-------|------|-------|\n| Optativa Fotografia | 3 | 3 | Aula |\n\n## Professors\n| Nom | Càrrega (h) |\n|-----|-------------|\n| Marc Puig | 16 |\n\n## Grups\n| Nom | Mida | Assignatures |\n|-----|------|--------------|\n| 3r M1 | 28 | RAIV; Optativa Fotografia |\n\n## Afinitats\n| Professor | Assignatura | Nivell |\n|-----------|-------------|--------|\n| Marc Puig | RAIV | 3 |</pre>\n\n<p>A <strong>Grups</strong>, la columna Assignatures és una llista separada per <strong>punt i coma</strong>\n(<code>;</code>) amb noms iguals als de la taula d'assignatures (el punt i coma evita confusions amb els\nnoms que ja porten comes). Si en cites alguna que no existeix, l'eina t'ho avisa.</p>\n\n<h3>Afinitats</h3>\n<p>La taula <strong>Afinitats</strong> enllaça professors amb assignatures: una fila per parella, amb un\n<strong>Nivell</strong> de 0 a 3 (3 = idoni, 0 = no pot). És ideal per carregar d'una tirada els\ncoordinadors o responsables de cada assignatura. Els noms de Professor i Assignatura han de coincidir\namb els de les altres taules; les parelles no reconegudes es reporten. Les afinitats s'actualitzen\nsempre sense esborrar les que ja tinguis.</p>\n\n<p class=\"callout\">Les <strong>disponibilitats</strong> són matrius i es configuren dins l'app, no pel\nMarkdown. Les <strong>afinitats</strong>, en canvi, sí que es poden importar amb la taula d'Afinitats.</p>\n\n<h3>Generar el text amb IA</h3>\n<p>El botó <em>⧉ Copia plantilla de prompt</em> posa al porta-retalls un prompt perquè una IA et torni\nexactament aquest format a partir de dades que hagis extret d'una web. Enganxa-li la plantilla seguida\ndel text de la web.</p>\n"}, {"id": "disponibilitats", "title": "Disponibilitats", "kw": ["disponibilitat", "preferides", "franges", "no disponible"], "body": "\n<p>A la pestanya <strong>Disponibilitats</strong> tries un professor i marques, clicant les cel·les de\nla seva graella setmanal, l'estat de cada franja:</p>\n<ul>\n<li><strong>No disponible</strong> (vermell): restricció dura. Mai s'hi assignarà classe.</li>\n<li><strong>Disponible</strong> (blanc): neutre.</li>\n<li><strong>Preferida</strong> (verd, ★): el motor premia col·locar-hi classe.</li>\n</ul>\n<p>Cada clic alterna entre els tres estats. Els botons <em>Tot disponible</em> i <em>Tot no disp.</em>\nomplen la graella de cop.</p>\n"}, {"id": "afinitats", "title": "Afinitats", "kw": ["afinitat", "matriu", "professor", "assignatura", "idoneïtat"], "body": "\n<p>La pestanya <strong>Afinitats</strong> és la matriu professor × assignatura. Cada clic puja el\nnivell de 0 a 3:</p>\n<ul>\n<li><strong>0</strong>: el professor <em>no pot</em> impartir l'assignatura.</li>\n<li><strong>1, 2</strong>: pot, amb idoneïtat creixent.</li>\n<li><strong>3</strong>: professor idoni.</li>\n</ul>\n<p>Només els professors amb afinitat &gt; 0 entren com a candidats d'una assignatura. Com més alta\nl'afinitat, més la premia el motor en escollir qui imparteix cada grup.</p>\n<p class=\"callout\">Assegura't que cada assignatura tingui almenys un professor amb afinitat &gt; 0;\nmillor dos o més, perquè el motor pugui repartir i evitar solapaments.</p>\n"}, {"id": "restriccions", "title": "Restriccions: dures i toves", "kw": ["restriccions", "dures", "toves", "desiderates", "pesos", "objectiu"], "body": "\n<p>La pestanya <strong>Restriccions</strong> té dues columnes.</p>\n\n<h3>Restriccions dures</h3>\n<p>S'han de complir. Si una solució en viola alguna (amb la restricció activada), es marca com a\n<strong>no factible</strong>. Pots desactivar-ne per relaxar el problema:</p>\n<ul>\n<li>Professor sense solapaments</li>\n<li>Grup sense solapaments</li>\n<li>Aula sense solapaments</li>\n<li>Respecta indisponibilitats</li>\n<li>Capacitat suficient</li>\n<li>Tipus d'aula correcte</li>\n</ul>\n\n<h3>Desiderates (toves)</h3>\n<p>No són obligatòries: el motor les minimitza segons el seu <strong>pes</strong> (control lliscant\n0–20). Apuja el pes del que t'importi més:</p>\n<ul>\n<li><strong>Hores preferides</strong>: usa les franges marcades com a preferides.</li>\n<li><strong>Afinitat assignatura</strong>: tria el professor més idoni.</li>\n<li><strong>Forats del professor</strong> / <strong>del grup</strong>: minimitza hores mortes.</li>\n<li><strong>Compacta dies prof.</strong>: concentra la docència en menys dies.</li>\n<li><strong>Equilibri de càrrega</strong>: reparteix hores entre professors.</li>\n<li><strong>Dispersa l'assignatura</strong>: evita repetir-la el mateix dia a un grup.</li>\n<li><strong>Evita franges dolentes</strong>: penalitza franges marcades globalment.</li>\n</ul>\n<p>El cost total que minimitza el motor és:\n<code>10000 × (violacions dures) + Σ (pes × desiderata)</code>. El factor enorme de les dures fa que\nel motor les eviti primer.</p>\n"}, {"id": "resoldre", "title": "Resoldre: el motor", "kw": ["resoldre", "motor", "recuit simulat", "iteracions", "reinicis", "temperatura", "llavor"], "body": "\n<p>A la pestanya <strong>Resoldre</strong> configures i llances la cerca.</p>\n\n<h3>Paràmetres</h3>\n<ul>\n<li><strong>Iteracions / reinici</strong>: moviments que prova cada cerca. Més = millor resultat, més\ntemps.</li>\n<li><strong>Reinicis</strong>: quantes cerques independents fa, partint de zero cada cop. Es queda amb\nla millor de totes.</li>\n<li><strong>Temp. inicial / final</strong>: controlen quant accepta el motor solucions pitjors per\nescapar de mínims locals. Comença \"calent\" (accepta molt) i s'acaba \"fred\" (només millores).</li>\n<li><strong>Llavor</strong>: fixa l'aleatorietat. La mateixa llavor i les mateixes dades donen sempre\nel mateix horari (reproduïble).</li>\n</ul>\n\n<h3>Durant la cerca</h3>\n<p>Pots <strong>aturar</strong> en qualsevol moment amb el botó ■; es conserva la millor solució\ntrobada fins llavors. Els indicadors mostren el <em>cost total</em>, les <em>violacions dures</em>, el\n<em>cost tou</em> i si és <em>factible</em>.</p>\n<p class=\"callout\">Si després de resoldre canvies dades, l'horari anterior pot quedar desfasat. No passa\nres: torna a prémer ▶ Resol per recalcular.</p>\n"}, {"id": "horari", "title": "Horari", "kw": ["horari", "graella", "vistes", "conflictes", "llegenda", "solapaments"], "body": "\n<p>La pestanya <strong>Horari</strong> mostra la graella resultant.</p>\n<ul>\n<li><strong>Vista</strong>: <em>Per grup</em>, <em>Per professor</em> o <em>Per aula</em>, i el\nselector del costat tria l'entitat concreta.</li>\n<li>Cada bloc mostra l'assignatura i, segons la vista, el professor, el grup i/o l'aula.</li>\n<li>Els <strong>solapaments</strong> dins la vista es ressalten amb vora vermella i s'indiquen a\nl'avís superior.</li>\n<li>La <strong>llegenda</strong> de sota relaciona colors i assignatures presents.</li>\n</ul>\n<p>Amb el botó <em>Imprimeix</em> de la capçalera surt només la graella, amb la signatura SBS BIM al\npeu.</p>\n"}, {"id": "metriques", "title": "Mètriques", "kw": ["mètriques", "qualitat", "càrrega", "conflictes", "avisos"], "body": "\n<p>La pestanya <strong>Mètriques</strong> resumeix la solució actual.</p>\n<ul>\n<li><strong>Qualitat</strong>: cost total, violacions dures, cost de desiderates i el desglossament per\ncada desiderata (amb el seu pes).</li>\n<li><strong>Càrrega per professor</strong>: hores assignades respecte de la càrrega màxima. Si se supera,\nes mostra en vermell.</li>\n<li><strong>Conflictes i avisos</strong>: llista els problemes durs concrets (solapaments, franges no\ndisponibles, aules petites o de tipus incorrecte) o confirma que l'horari és factible.</li>\n</ul>\n"}, {"id": "fitxers", "title": "Desar, exportar i persistència", "kw": ["desar", "exportar", "importar", "json", "csv", "ics", "localStorage", "persistència", "imprimir"], "body": "\n<p>Des de la capçalera:</p>\n<ul>\n<li><strong>Desa .json</strong> / <strong>Importa .json</strong>: desa o recupera <em>tot</em> l'estat\n(dades, matrius, restriccions i última solució) en un fitxer.</li>\n<li><strong>CSV</strong>: exporta l'horari resolt com a taula (dia, hores, assignatura, grup, professor,\naula).</li>\n<li><strong>.ics</strong>: exporta l'horari com a calendari (esdeveniments setmanals) per importar a\nGoogle Calendar, Outlook o Apple Calendar.</li>\n<li><strong>Imprimeix</strong>: imprimeix la graella.</li>\n</ul>\n\n<h3>Memòria entre sessions</h3>\n<p>L'eina desa automàticament tot l'estat al navegador (<code>localStorage</code>) a cada canvi i el\nrecupera en reobrir-la. No cal desar res manualment per no perdre la feina; el botó <em>Exemple</em>\ndemana confirmació abans de substituir les teves dades.</p>\n<p class=\"callout\">La persistència funciona en el fitxer descarregat i en l'app empaquetada amb\nTauri/pake. Dins d'una previsualització incrustada (iframe aïllat) pot no conservar-se; en aquest cas,\nfes servir <em>Desa .json</em>.</p>\n"}, {"id": "motor", "title": "Com funciona el motor", "kw": ["motor", "csp", "optimització", "recuit simulat", "metaheurística", "NP-difícil"], "body": "\n<p>La combinació d'horaris és un problema de <strong>satisfacció de restriccions i optimització</strong>\n(timetabling), NP-difícil: no hi ha fórmula directa i el nombre de combinacions creix explosivament.</p>\n\n<h3>Recuit simulat (simulated annealing)</h3>\n<p>El motor parteix d'una assignació inicial i va provant petits <strong>moviments</strong>: canviar la\nfranja d'una sessió, canviar-ne l'aula, intercanviar les franges de dues sessions o canviar el\nprofessor d'una assignatura-grup. Cada moviment s'accepta si millora el cost; si l'empitjora, s'accepta\namb una probabilitat que depèn de la <em>temperatura</em>, alta al principi i baixa al final. Així\nescapa de mínims locals i va refinant.</p>\n\n<h3>Per què no IA generativa</h3>\n<p>Un model de llenguatge no garanteix el compliment de restriccions, no és reproduïble i pot inventar\nassignacions impossibles. La cerca d'optimització, en canvi, és determinista (amb llavor fixa),\nverificable i ràpida. La IA generativa sí que ajuda en una cosa: generar el text Markdown d'importació\na partir de dades d'una web (vegeu <a href=\"import.htm\">Importar</a>).</p>\n"}, {"id": "problemes", "title": "Resolució de problemes", "kw": ["problemes", "no factible", "errors", "capacitat", "sense professor"], "body": "\n<h3>Surt «no factible» i no baixa de zero violacions dures</h3>\n<ul>\n<li><strong>Aula petita o de tipus incorrecte</strong>: comprova que hi hagi aules del tipus de cada\nassignatura amb capacitat ≥ la mida del grup. Exemple típic: una sala d'informàtica massa petita per a\nun grup gran.</li>\n<li><strong>Massa poques franges</strong>: si la suma d'hores no hi cap sense solapaments, amplia dies o\nhores/dia a la graella temporal.</li>\n<li><strong>Indisponibilitats massa restrictives</strong>: un professor amb poques franges disponibles\ni moltes assignatures pot fer-ho impossible.</li>\n</ul>\n\n<h3>«Assignatures sense professor possible»</h3>\n<p>Alguna assignatura no té cap professor amb afinitat &gt; 0. Ves a <a href=\"afinitats.htm\">Afinitats</a>\ni assigna-n'hi almenys un.</p>\n\n<h3>Els grups importats no enllacen assignatures</h3>\n<p>Els noms de la columna Assignatures del Markdown han de coincidir amb els de les assignatures\nexistents. L'eina avisa de les no reconegudes; revisa'n l'ortografia o importa abans les assignatures.</p>\n\n<h3>Va lent</h3>\n<p>Abaixa les iteracions o els reinicis a <a href=\"resoldre.htm\">Resoldre</a>. Per a problemes molt\ngrans (centenars de sessions), apuja-les però compta amb més temps de càlcul.</p>\n"}, {"id": "tauri", "title": "Empaquetar com a aplicació", "kw": ["tauri", "pake", "executable", "escriptori", "offline"], "body": "\n<p>Com que GuaitaHoraris és un únic fitxer HTML sense dependències, es pot convertir en una aplicació\nd'escriptori que funciona offline.</p>\n<ul>\n<li><strong>pake</strong>: la via més ràpida. Genera un executable a partir del fitxer HTML (o d'una\nURL local).</li>\n<li><strong>Tauri</strong>: més control (icona, finestra, signatura). El fitxer HTML fa de\n<em>front-end</em>.</li>\n</ul>\n<p>En tots dos casos la persistència entre sessions (<code>localStorage</code>) i totes les funcions\nes mantenen, perquè tot és local.</p>\n"}];
let cur=0;
function buildNav(term){
  const nav=document.getElementById('nav');const t=(term||'').toLowerCase();
  const list=TOPICS.map((x,i)=>({x,i})).filter(({x})=>{
    if(!t)return true;
    return x.title.toLowerCase().includes(t)||x.kw.join(' ').toLowerCase().includes(t)||x.body.toLowerCase().includes(t);
  });
  if(!list.length){nav.innerHTML='<div class="empty">Cap resultat.</div>';return;}
  nav.innerHTML=list.map(({x,i})=>{
    let title=x.title;
    if(t){const idx=title.toLowerCase().indexOf(t);if(idx>=0)title=title.slice(0,idx)+'<span class="hl">'+title.slice(idx,idx+t.length)+'</span>'+title.slice(idx+t.length);}
    return `<a class="${i===cur?'active':''}" onclick="show(${i})">${title}</a>`;
  }).join('');
}
function show(i){
  cur=i;const x=TOPICS[i];
  const prev=i>0?`<button onclick="show(${i-1})">← ${TOPICS[i-1].title}</button>`:'<button disabled>←</button>';
  const next=i<TOPICS.length-1?`<button onclick="show(${i+1})">${TOPICS[i+1].title} →</button>`:'<button disabled>→</button>';
  document.getElementById('content').innerHTML=
    `<h1>${x.title}</h1><div class="crumb">GuaitaHoraris · Ajuda</div>${x.body}
     <div class="nav-btns">${prev}${next}</div>
     <div class="foot"><span class="sig">SBS BIM</span><span>combinador d'horaris sense IA generativa</span></div>`;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.remove('active'));
  buildNav(document.getElementById('q').value);
  document.querySelector('main').scrollTop=0;
}
function filter(v){buildNav(v);}
// enllaços interns .htm → índex
document.addEventListener('click',e=>{const a=e.target.closest('a[href$=".htm"]');if(a){e.preventDefault();
  const id=a.getAttribute('href').replace('.htm','');const idx=TOPICS.findIndex(t=>t.id===id);if(idx>=0)show(idx);}});
buildNav('');show(0);
</script>
